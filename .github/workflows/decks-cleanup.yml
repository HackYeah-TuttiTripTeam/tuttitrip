name: Decks cleanup

# Po usunięciu gałęzi usuwa jej Worker z prezentacjami (tuttitrip-decks-<slug>)
# razem z domeną. Gałęzi usuniętych przez workflow (GITHUB_TOKEN) ten event nie
# łapie, dlatego to samo sprzątanie robi każde wdrożenie w decks.yml.
on:
  delete:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup:
    if: github.event_name == 'workflow_dispatch' || github.event.ref_type == 'branch'
    runs-on: [self-hosted, hackathon]
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Delete Workers without a branch
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::Cloudflare credentials missing, nothing deleted."; exit 0
          fi
          node docs/presentations/_site/cleanup.mjs
