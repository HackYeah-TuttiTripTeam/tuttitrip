name: Delete merged branch

# Po merge'u PR usuwa jego gałąź (nigdy main). Logika jest wspólna, w
# repozytorium HackYeah-TuttiTripTeam/.github (workflow delete-merged-branch.yml).
# Działa na runnerze GitHuba (ubuntu-latest) i nie pobiera kodu.
on:
  pull_request:
    types: [closed]

permissions:
  contents: write
  pull-requests: read

jobs:
  delete:
    uses: HackYeah-TuttiTripTeam/.github/.github/workflows/delete-merged-branch.yml@main
