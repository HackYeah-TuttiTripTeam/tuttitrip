name: Issue format

# Sprawdza tytuł i sekcje każdego nowego lub edytowanego zgłoszenia.
# Logika i zasady są wspólne dla całej organizacji, w repozytorium
# HackYeah-TuttiTripTeam/.github (workflow issue-format.yml, CONTRIBUTING.md).
# Logika w repozytorium .github działa na runnerach self-hosted [self-hosted, hackathon].
on:
  issues:
    types: [opened, edited, reopened]

permissions:
  issues: write

jobs:
  check:
    uses: HackYeah-TuttiTripTeam/.github/.github/workflows/issue-format.yml@main
