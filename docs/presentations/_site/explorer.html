<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{heading}} · TuttiTrip</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600&family=Funnel+Display:wght@600&display=swap" rel="stylesheet">
<style>
/* Tokens from the app (frontend/DESIGN.md). */
:root {
  color-scheme: light dark;
  --background: oklch(98.6% 0.005 165);
  --foreground: oklch(21% 0.02 170);
  --muted: oklch(45% 0.018 170);
  --card: oklch(100% 0 0);
  --border: oklch(90% 0.01 165);
  --brand: #00774d;
  --accent: oklch(94% 0.025 165);
  --font-display: "Funnel Display", "Atkinson Hyperlegible Next", system-ui, sans-serif;
  --font-sans: "Atkinson Hyperlegible Next", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --background: oklch(16% 0.012 170);
    --foreground: oklch(96.5% 0.008 165);
    --muted: oklch(70% 0.02 165);
    --card: oklch(20.5% 0.014 170);
    --border: oklch(100% 0 0 / 0.1);
    --brand: #3fbf8a;
    --accent: oklch(28% 0.025 168);
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--background);
  color: var(--foreground);
  font: 400 1rem/1.5 var(--font-sans);
}
main { max-width: 52rem; margin: 0 auto; padding: 3rem 1rem 4rem; }
.brand { margin: 0; display: flex; align-items: center; gap: 0.6rem; font: 600 1.25rem/1 var(--font-display); letter-spacing: -0.02em; }
.logo { width: 2rem; height: 2rem; }
.lg-sky { fill: #0a2f23; }
@media (prefers-color-scheme: dark) { .lg-sky { fill: #0f4434; } }
h1 { margin: 0.25rem 0 2rem; font: 600 clamp(2rem, 6vw, 3rem)/1.1 var(--font-display); }
.decks { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.75rem; }
.deck {
  display: grid;
  gap: 0.25rem;
  padding: 1.25rem;
  border: 1px solid var(--border);
  border-radius: 0.75rem;
  background: var(--card);
  color: inherit;
  text-decoration: none;
  transition: border-color 0.15s, background-color 0.15s;
}
.deck:hover { border-color: var(--brand); background: var(--accent); }
.deck:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }
.kind {
  justify-self: start;
  padding: 0.1rem 0.5rem;
  border-radius: 999px;
  background: var(--accent);
  color: var(--brand);
  font-size: 0.8rem;
  font-weight: 600;
}
.title { font: 600 1.25rem/1.3 var(--font-display); }
.description { color: var(--muted); }
.path { color: var(--muted); font-size: 0.875rem; overflow-wrap: anywhere; }
.decks li { display: grid; gap: 0.5rem; }
.files { display: flex; gap: 1rem; padding: 0 0.25rem; }
.files a { color: var(--brand); font-weight: 600; text-underline-offset: 3px; }
.empty { color: var(--muted); }
.empty a { color: var(--brand); }
</style>
</head>
<body>
<main>
  <p class="brand"><svg class="logo" viewBox="0 0 512 512" aria-hidden="true"><defs><clipPath id="ttk"><circle cx="256" cy="256" r="256"/></clipPath></defs><circle cx="256" cy="256" r="256" class="lg-sky"/><g clip-path="url(#ttk)"><rect y="256" width="512" height="274" fill="#00774d"/><path d="M256 256L126 520H386Z" fill="#f5efe6"/><path d="M254.35 282.40L257.64 282.40L258.01 293.66L253.99 293.66Z" class="lg-sky"/><path d="M253.63 304.93L258.37 304.93L259.03 325.81L252.97 325.81Z" class="lg-sky"/><path d="M252.30 346.69L259.70 346.69L260.94 385.38L251.06 385.38Z" class="lg-sky"/><path d="M249.82 424.08L262.18 424.08L264.48 495.80L247.52 495.80Z" class="lg-sky"/></g><circle cx="256" cy="146" r="48" class="lg-sky" stroke="#f2b53a" stroke-width="28"/></svg>TuttiTrip</p>
  <h1>{{heading}}</h1>
  {{body}}
</main>
</body>
</html>
